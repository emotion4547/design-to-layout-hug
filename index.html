    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://example.com/" />
    <meta name="twitter:title" content="Везу букет — Доставка цветов и букетов" />

    <!-- Structured Data - Local Business -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Store",
      "name": "Везу букет",
      "image": "https://example.com/og-image.jpg",
      "description": "Доставка свежих цветов и букетов. С любовью в каждом букете.",
      "@id": "https://example.com",
      "url": "https://example.com",
      "telephone": "+7 (XXX) XXX-XX-XX",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "",
        "addressLocality": "Ваш город",
        "addressCountry": "RU"
      },
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": [
          "Monday",
          "Tuesday",
          "Wednesday",
          "Thursday",
          "Friday",
          "Saturday",
          "Sunday"
        ],
        "opens": "09:00",
        "closes": "21:00"
      },
      "priceRange": "₽₽"
    }
    </script>

    <!-- Structured Data - Website -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Везу букет",
      "url": "https://example.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://example.com/catalog?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Theme Color -->
    <meta name="theme-color" content="#d4728c" />
    <meta name="msapplication-TileColor" content="#d4728c" />

  <body>
    <div id="root"></div>
